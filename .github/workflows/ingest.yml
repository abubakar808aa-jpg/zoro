name: Job ingestion

# Runs the scheduler every 2 hours; each source is only actually fetched when
# it's due (priority sources every 2–4h, normal every 6–12h — enforced by
# nextFetchAt in /api/ingest/run). Also runnable on demand.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion run
        env:
          INGEST_URL: ${{ secrets.INGEST_RUN_URL }}       # https://<your-domain>/api/ingest/run
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
        run: |
          if [ -z "$INGEST_URL" ] || [ -z "$INGESTION_SECRET" ]; then
            echo "INGEST_RUN_URL / INGESTION_SECRET secrets not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$INGEST_URL" \
            -H "Authorization: Bearer $INGESTION_SECRET" \
            -H 'Content-Type: application/json' --max-time 290)
          echo "HTTP $code"; cat /tmp/out.json
          test "$code" = "200"
