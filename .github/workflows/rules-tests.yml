name: Firestore Rules

on:
  push:
    branches: [main]
  # Run on every PR — the rules are security-critical, and app-code changes
  # can depend on their behavior, so we don't gate this on rule files changing.
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Firestore & Storage emulators are Java processes;
      # current firebase-tools requires a JDK at version 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install test dependencies
        run: npm install --prefix firestore-tests

      - name: Run rules tests against the emulator
        run: yarn test:rules
