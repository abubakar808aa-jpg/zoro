name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # firebase-admin@14 requires Node >=22.
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests (ingestion normalization)
        run: yarn test:unit

      - name: Build web app
        run: yarn build:web
        # The Firebase web config now comes from the environment (not source).
        # These are throwaway placeholders so static prerendering can initialize
        # Firebase during the build — real values are set in Vercel, never here.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-jobman.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-jobman
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-jobman.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0000000000:web:ci"
